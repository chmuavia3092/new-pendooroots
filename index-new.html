    <!-- GRAINIENT WebGL2 SHADER -->
    <script>
    (function() {
      var container = document.getElementById('grainientBg');
      if (!container) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var COLORS = {
        c1: [0.298, 0.702, 0.314],
        c2: [0.106, 0.369, 0.125],
        c3: [0.039, 0.180, 0.039]
      };

      var vertSrc = '#version 300 es\nin vec2 position;\nvoid main(){gl_Position=vec4(position,0.0,1.0);}';
      var fragSrc = '#version 300 es\nprecision highp float;\nuniform vec2 iResolution;uniform float iTime;\nuniform vec3 uColor1,uColor2,uColor3;\nout vec4 fragColor;\n#define S(a,b,t) smoothstep(a,b,t)\nmat2 Rot(float a){float s=sin(a),c=cos(a);return mat2(c,-s,s,c);}\nvec2 hash(vec2 p){p=vec2(dot(p,vec2(2127.1,81.17)),dot(p,vec2(1269.5,283.37)));return fract(sin(p)*43758.5453);}\nfloat noise(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);return 0.5+0.5*mix(mix(dot(-1.0+2.0*hash(i),f),dot(-1.0+2.0*hash(i+vec2(1,0)),f-vec2(1,0)),u.x),mix(dot(-1.0+2.0*hash(i+vec2(0,1)),f-vec2(0,1)),dot(-1.0+2.0*hash(i+vec2(1,1)),f-vec2(1,1)),u.x),u.y);}\nvoid mainImage(out vec4 o,vec2 C){float t=iTime*0.25;vec2 uv=C/iResolution.xy;float ratio=iResolution.x/iResolution.y;vec2 tuv=uv-0.5;tuv/=max(0.9,0.001);float degree=noise(vec2(t*0.1,tuv.x*tuv.y)*2.0);tuv.y*=1.0/ratio;tuv*=Rot(radians((degree-0.5)*500.0+180.0));tuv.y*=ratio;float warpTime=t*2.0;tuv.x+=sin(tuv.y*5.0+warpTime)/50.0;tuv.y+=sin(tuv.x*7.5+warpTime)/25.0;float b=0.0;float s=0.05;mat2 blendRot=Rot(radians(0.0));float blendX=(tuv*blendRot).x;float edge0=-0.3-b-s;float edge1=0.2-b+s;float v0=0.5-b+s;float v1=-0.3-b-s;vec3 layer1=mix(uColor3,uColor2,S(edge0,edge1,blendX));vec3 layer2=mix(uColor2,uColor1,S(edge0,edge1,blendX));vec3 col=mix(layer1,layer2,S(v0,v1,tuv.y));vec2 grainUv=uv*2.0;float grain=fract(sin(dot(grainUv,vec2(12.9898,78.233)))*43758.5453);col+=(grain-0.5)*0.1;col=(col-0.5)*1.5+0.5;float luma=dot(col,vec3(0.2126,0.7152,0.0722));col=mix(vec3(luma),col,1.0);col=pow(max(col,0.0),vec3(1.0));col=clamp(col,0.0,1.0);o=vec4(col,1.0);}\nvoid main(){vec4 o=vec4(0.0);mainImage(o,gl_FragCoord.xy);fragColor=o;}';

      var gl = container.getContext('webgl2');
      if (!gl) return;

      function compile(type, src) {
        var s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
        return s;
      }

      var vs = compile(gl.VERTEX_SHADER, vertSrc);
      var fs = compile(gl.FRAGMENT_SHADER, fragSrc);
      if (!vs || !fs) return;

      var prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
      gl.useProgram(prog);

      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      var pos = gl.getAttribLocation(prog, 'position');
      gl.enableVertexAttribArray(pos);
      gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

      var uRes = gl.getUniformLocation(prog, 'iResolution');
      var uTime = gl.getUniformLocation(prog, 'iTime');
      var uC1 = gl.getUniformLocation(prog, 'uColor1');
      var uC2 = gl.getUniformLocation(prog, 'uColor2');
      var uC3 = gl.getUniformLocation(prog, 'uColor3');

      gl.uniform3fv(uC1, COLORS.c1);
      gl.uniform3fv(uC2, COLORS.c2);
      gl.uniform3fv(uC3, COLORS.c3);

      var canvas = gl.canvas;
      canvas.style.cssText = 'width:100%;height:100%;display:block;position:absolute;top:0;left:0;';
      container.appendChild(canvas);

      function resize() {
        var w = container.clientWidth || window.innerWidth;
        var h = container.clientHeight || window.innerHeight;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform2f(uRes, canvas.width, canvas.height);
      }

      var t0 = performance.now();
      var raf = 0;
      var isVisible = true;
      var isPageVisible = !document.hidden;

      function frame(t) {
        gl.uniform1f(uTime, (t - t0) * 0.001);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        raf = requestAnimationFrame(frame);
      }

      function tryStart() {
        if (isVisible && isPageVisible && raf === 0) raf = requestAnimationFrame(frame);
      }
      function tryStop() {
        if (raf !== 0) { cancelAnimationFrame(raf); raf = 0; }
      }

      var io = new IntersectionObserver(function(entries) {
        isVisible = entries[0].isIntersecting;
        isVisible ? tryStart() : tryStop();
      }, { threshold: 0 });
      io.observe(container);

      document.addEventListener('visibilitychange', function() {
        isPageVisible = !document.hidden;
        isPageVisible ? tryStart() : tryStop();
      });

      window.addEventListener('resize', resize);
      resize();
      tryStart();
    })();
    </script>
